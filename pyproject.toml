[build-system]
requires = [
    "setuptools >= 40.9.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "karton-core"
description = "Distributed malware analysis orchestration framework"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/CERT-Polska/karton"
Documentation = "https://karton-core.readthedocs.io/"
Repository = "https://github.com/CERT-Polska/karton"

[project.scripts]
karton-system = "karton.system:SystemService.main"
karton = "karton.core.main:main"
karton-auth = "karton.core.auth.cli:main"

[tool.setuptools]
packages = ["karton.core", "karton.core.auth", "karton.core.asyncio", "karton.core.backend", "karton.core.asyncio.backend", "karton.system", "karton.gateway"]

[tool.setuptools.dynamic]
version = {attr = "karton.core.__version__.__version__"}
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
gateway = { file = ["requirements.gateway.txt"] }

[tool.ruff]
extend-exclude = [
    "README.md"
]

[tool.ruff.lint]
extend-ignore = [
    "ASYNC230",
    "BLE001",
    "RUF012",
    "SIM103",
    "SIM115",
    "TRY004",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "urllib3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aioboto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiobotocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gunicorn.*"
ignore_missing_imports = true