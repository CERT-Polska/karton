name: Test the code
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  lint-ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4
        with:
          version: 0.17.0
      - run: ruff check
      - run: ruff format --check --diff
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt -r requirements.gateway.txt
      - name: Install mypy and botocore-stubs
        run: pip install mypy==2.4.0 botocore-stubs
      - run: mypy karton
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minor: [12, 13, 14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.${{ matrix.minor }}
      - run: pip install -r requirements.txt -r requirements.gateway.txt
      - run: python -m unittest discover tests/unit
  e2etest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: docker compose -f tests/e2e/docker-compose.yml up --build --exit-code-from pytest
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Karton
        run: pip install .
      - name: Install docs dependencies
        working-directory: docs
        run: pip install -r requirements.txt
      - name: Build docs
        working-directory: docs
        run: make html
